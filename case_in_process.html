<!DOCTYPE html>
<html>
<head>
    <title>Case In Process Tracker</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f6f7;
            color: #32363a;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
        }

        .card {
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.15);
            padding: 24px 32px;
            max-width: 400px;
            width: 100%;
            text-align: center;
        }

        h2 {
            margin: 0 0 16px;
            font-size: 18px;
            color: #0a6ed1;
        }

        p {
            font-size: 15px;
            margin: 8px 0;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Case created from Lead</h2>
        <p>Lead ID: <strong id="leadID">-</strong></p>
        <p>Lead Name: <strong id="leadName">-</strong></p>
        <p>Lead Display ID: <strong id="leadDisplayId">-</strong></p>
    </div>

    <script>
        // SAP binds these via mashup parameters, e.g. ?leadID=...&leadName=...&leadDisplayId=...
        const params = new URLSearchParams(window.location.search);
        const leadID = params.get('leadID') || '';
        const leadName = params.get('leadName') || '';
        const leadDisplayId = params.get('leadDisplayId') || '';

        document.getElementById('leadID').textContent = leadID || 'Not set';
        document.getElementById('leadName').textContent = leadName || 'Not set';
        document.getElementById('leadDisplayId').textContent = leadDisplayId || 'Not set';
    </script>

</body>
</html>
