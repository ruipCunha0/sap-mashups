<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lead Details Mashup</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: "72", Arial, sans-serif;
            margin: 0;
            padding: 12px;
            background: #fff;
            color: #1a1a1a;
        }

        .field {
            margin-bottom: 10px;
        }

        .label {
            font-weight: bold;
            color: #556;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.02em;
        }

        .value {
            font-size: 15px;
            color: #111;
        }

        .message {
            font-size: 13px;
            padding: 8px 10px;
            border-radius: 4px;
        }

        .message.loading {
            color: #555;
            background: #f2f2f2;
        }

        .message.error {
            color: #b00020;
            background: #fdecea;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <div id="loadingMessage" class="message loading">A carregar dados da Lead...</div>
    <div id="errorMessage" class="message error hidden"></div>

    <div id="leadDetails" class="hidden">
        <div class="field">
            <div class="label">Nome</div>
            <div class="value" id="leadName">-</div>
        </div>
        <div class="field">
            <div class="label">Display ID</div>
            <div class="value" id="leadDisplayId">-</div>
        </div>
        <div class="field">
            <div class="label">Lead ID</div>
            <div class="value" id="leadId">-</div>
        </div>
        <div class="field">
            <div class="label">Status</div>
            <div class="value" id="leadStatus">-</div>
        </div>
    </div>

    <script>
        // TODO: substituir pelo URL real da app CAP depois do deploy (cf app <nome> para o veres),
        // por exemplo: https://ct-cx-internal-training-projects-mashup-case-srv.cfapps.eu10.hana.ondemand.com
        const API_BASE_URL = "https://REPLACE_WITH_CAP_APP_URL";

        function getQueryParam(name) {
            const params = new URLSearchParams(window.location.search);
            return params.get(name);
        }

        function showError(message) {
            document.getElementById("loadingMessage").classList.add("hidden");
            document.getElementById("leadDetails").classList.add("hidden");
            const errorEl = document.getElementById("errorMessage");
            errorEl.textContent = message;
            errorEl.classList.remove("hidden");
        }

        function showLeadDetails(lead) {
            document.getElementById("loadingMessage").classList.add("hidden");
            document.getElementById("errorMessage").classList.add("hidden");

            document.getElementById("leadName").textContent = lead.name || "-";
            document.getElementById("leadDisplayId").textContent = lead.displayId || "-";
            document.getElementById("leadId").textContent = lead.id || "-";
            document.getElementById("leadStatus").textContent = lead.status || "-";

            document.getElementById("leadDetails").classList.remove("hidden");
        }

        // O mashup (configurado no SAP Sales and Service Cloud) deve vincular
        // diretamente a extensão CAP_LEAD do Case como parâmetro de URL, por
        // exemplo: https://.../case_in_process.html?leadId={CAP_LEAD}
        const leadId = getQueryParam("leadId");

        if (!leadId) {
            showError("Parâmetro 'leadId' em falta no URL do mashup.");
        } else {
            fetch(`${API_BASE_URL}/api/lead/${encodeURIComponent(leadId)}`)
                .then(response => {
                    if (!response.ok) {
                        return response.json()
                            .then(body => {
                                throw new Error(body && body.error ? body.error : `HTTP ${response.status}`);
                            })
                            .catch(() => {
                                throw new Error(`HTTP ${response.status}`);
                            });
                    }
                    return response.json();
                })
                .then(showLeadDetails)
                .catch(error => {
                    console.error("Erro ao carregar dados da Lead:", error);
                    showError("Não foi possível carregar os dados da Lead: " + error.message);
                });
        }
    </script>

</body>
</html>
