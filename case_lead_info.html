<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8" />
    <title>Lead Info Mashup</title>
    <style>
        body {
            font-family: "72", Arial, sans-serif;
            margin: 0;
            padding: 12px;
            font-size: 14px;
            color: #32363a;
        }
        .field {
            display: flex;
            margin-bottom: 8px;
        }
        .label {
            font-weight: bold;
            width: 140px;
            flex-shrink: 0;
        }
        .value {
            flex-grow: 1;
        }
        .message {
            padding: 8px;
            border-radius: 4px;
        }
        .message.loading {
            color: #0a6ed1;
        }
        .message.error {
            color: #b00;
            background: #fdeeee;
            border: 1px solid #f0b4b4;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <div id="content">
        <div class="message loading" id="loadingMessage">A carregar dados da Lead...</div>
    </div>

    <div id="leadDetails" style="display:none;">
        <div class="field">
            <div class="label">Nome:</div>
            <div class="value" id="leadName">-</div>
        </div>
        <div class="field">
            <div class="label">Display ID:</div>
            <div class="value" id="leadDisplayId">-</div>
        </div>
        <div class="field">
            <div class="label">Lead ID:</div>
            <div class="value" id="leadId">-</div>
        </div>
        <div class="field">
            <div class="label">Status:</div>
            <div class="value" id="leadStatus">-</div>
        </div>
    </div>

    <script>
        // TODO: already pointing to the deployed CAP app. Update if the app is redeployed with a new route.
        const API_BASE_URL = "https://dtt-tech-sa-lnsjm4g1k0br17jj-dev-ct-cx-internal-trainin7585351e.cfapps.eu10-005.hana.ondemand.com";

        function normalizeParamName(name) {
            return name.toLowerCase().replace(/[_-]/g, "");
        }

        function getLeadIdFromUrl() {
            const params = new URLSearchParams(window.location.search);
            const candidates = ["leadid"];
            for (const [key, value] of params.entries()) {
                if (candidates.includes(normalizeParamName(key))) {
                    return value;
                }
            }
            return null;
        }

        function showError(message) {
            document.getElementById("content").innerHTML =
                '<div class="message error">' + message + '</div>';
        }

        function showLeadDetails(lead) {
            document.getElementById("content").style.display = "none";
            document.getElementById("leadDetails").style.display = "block";
            document.getElementById("leadName").textContent = lead.name || "-";
            document.getElementById("leadDisplayId").textContent = lead.displayId || "-";
            document.getElementById("leadId").textContent = lead.id || "-";
            document.getElementById("leadStatus").textContent = lead.status || "-";
        }

        const leadId = getLeadIdFromUrl();

        if (!leadId) {
            showError(
                "Parâmetro do Lead ID em falta no URL do mashup. URL recebido: " +
                window.location.href +
                ". Verifica no editor de parâmetros do mashup se o campo está vinculado à extensão CAP_LEAD."
            );
        } else {
            fetch(API_BASE_URL + "/api/lead/" + encodeURIComponent(leadId))
                .then(function (response) {
                    if (!response.ok) {
                        return response.json().then(function (body) {
                            throw new Error(body.error || ("HTTP " + response.status));
                        });
                    }
                    return response.json();
                })
                .then(showLeadDetails)
                .catch(function (err) {
                    showError("Não foi possível carregar os dados da Lead: " + err.message);
                });
        }
    </script>
</body>
</html>
